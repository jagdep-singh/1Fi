databases:
  - name: 1fi-db
    plan: free
    databaseName: onefi
    user: onefi

services:
  - type: web
    name: 1fi-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: 1fi-db
          property: connectionString
      - key: PORT
        value: 8383
      - key: CORS_ORIGIN
        sync: false
